<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maine Divorce AI Assistant</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      height:100vh;
    }

    .chat-toggle{
      position:fixed;
      bottom:20px;
      right:20px;
      width:65px;
      height:65px;
      border-radius:50%;
      background:#111827;
      color:white;
      border:none;
      cursor:pointer;
      font-size:28px;
      box-shadow:0 8px 25px rgba(0,0,0,0.2);
      z-index:9999;
    }

    .chat-widget{
      position:fixed;
      bottom:100px;
      right:20px;
      width:370px;
      max-width:95%;
      height:600px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 40px rgba(0,0,0,0.2);
      display:none;
      flex-direction:column;
      z-index:9999;
    }

    .chat-header{
      background:#111827;
      color:white;
      padding:18px;
      font-size:18px;
      font-weight:bold;
    }

    .chat-messages{
      flex:1;
      padding:15px;
      overflow-y:auto;
      background:#f9fafb;
    }

    .message{
      margin-bottom:15px;
      padding:12px 14px;
      border-radius:14px;
      max-width:85%;
      line-height:1.5;
      font-size:14px;
    }

    .user{
      background:#111827;
      color:white;
      margin-left:auto;
    }

    .bot{
      background:#e5e7eb;
      color:#111;
    }

    .chat-input{
      display:flex;
      padding:12px;
      border-top:1px solid #ddd;
      background:white;
    }

    .chat-input input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      outline:none;
    }

    .chat-input button{
      margin-left:10px;
      padding:12px 18px;
      border:none;
      background:#111827;
      color:white;
      border-radius:10px;
      cursor:pointer;
    }

    .cta{
      padding:12px;
      text-align:center;
      border-top:1px solid #eee;
    }

    .cta a{
      display:inline-block;
      background:#2563eb;
      color:white;
      text-decoration:none;
      padding:10px 18px;
      border-radius:10px;
      font-size:14px;
    }

    @media(max-width:600px){
      .chat-widget{
        width:95%;
        right:10px;
        bottom:90px;
      }
    }
  </style>
</head>

<body>

<button class="chat-toggle" onclick="toggleChat()">💬</button>

<div class="chat-widget" id="chatWidget">

  <div class="chat-header">
    Maine Divorce AI Assistant
  </div>

  <div class="chat-messages" id="messages">
    <div class="message bot">
      Hi 👋 Ask me anything about divorce, custody, mediation, or legal process.
    </div>
  </div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your question..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <div class="cta">
    <a href="https://calendly.com/" target="_blank">
      Book a Call
    </a>
  </div>

</div>

<script>

const API_URL = "https://maine-divorce-bot.onrender.com/chat";

function toggleChat(){
  const widget = document.getElementById("chatWidget");

  if(widget.style.display === "flex"){
    widget.style.display = "none";
  } else {
    widget.style.display = "flex";
  }
}

async function sendMessage(){

  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");

  const text = input.value.trim();

  if(!text) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.innerText = text;

  messages.appendChild(userMessage);

  input.value = "";

  messages.scrollTop = messages.scrollHeight;

  const botThinking = document.createElement("div");
  botThinking.className = "message bot";
  botThinking.innerText = "Typing...";

  messages.appendChild(botThinking);

  messages.scrollTop = messages.scrollHeight;

  try{

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        question:text
      })
    });

    const data = await response.json();

    botThinking.innerText = data.answer || "No response found.";

  }catch(error){

    botThinking.innerText = "Error connecting to AI server.";

  }

  messages.scrollTop = messages.scrollHeight;

}

</script>

</body>
</html>
