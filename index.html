<!DOCTYPE html>
<html>
<head>
  <title>Maine Divorce Bot Test</title>

  <style>
    body {
      font-family: Arial;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #answer {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h2>Maine Divorce Bot Test</h2>

<textarea id="question" placeholder="Ask your question here..."></textarea>

<br>

<button onclick="askBot()">Ask Bot</button>

<div id="answer"></div>

<script>

async function askBot() {

    const question = document.getElementById("question").value;

    const answerDiv = document.getElementById("answer");

    answerDiv.innerText = "Thinking...";

    try {

        const response = await fetch("https://maine-divorce-bot.onrender.com/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })

        });

        const data = await response.json();

        let sourcesText = "";
if (data.answer && data.answer.includes("This topic is not covered in the course materials")) {
  answerDiv.innerText = data.answer;
  return;
}
        if (data.sources && data.sources.length > 0) {

            sourcesText = "\n\n---\nSources:\n";

            data.sources.forEach((s, index) => {

                sourcesText += `\n${index + 1}. Module Name: ${s.module_name}
Section Name: ${s.section_name}
Video Number: ${s.video_number}
Video Title: ${s.video_title}\n`;

            });

        }

        answerDiv.innerText = data.answer + sourcesText;

    } catch (error) {

        answerDiv.innerText = "Error: " + error.message;

    }

}

</script>

</body>
</html>
